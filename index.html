<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="left-login">
            <h1> Faça login e<br>entre
                para o nosso time</h1>

            <img src="Astronaut-bro.svg" alt="Astronauta" width="200px">
        </div>

        <div class="right-login">
            <div class="card">

                <h1>
                    LOGIN
                </h1>
                <form action="#">
                    <div class="input-box">
                        <label for="user">Usuário</label>
                        <input type="text" id="user" placeholder="Usuário" required>
                    </div>

                    <div class="input-box">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Senha" required>
                    </div>

                    <button>
                        Login
                    </button>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
